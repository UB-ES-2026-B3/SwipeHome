name: CI

# Se ejecuta en cada PR hacia dev o main, y en cada push a dev.
# El objetivo es que nadie mezcle codigo que rompe los tests.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Si se empuja dos veces seguidas a la misma rama, cancela la ejecucion
# anterior en lugar de gastar minutos en un commit ya superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Node para Firebase Auth Emulator
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Java para Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Comprobaciones de Django
        run: python manage.py check

      - name: Tests
        run: python manage.py test accounts properties --verbosity 2

      - name: Integración US4 y US6 con Firebase Auth y Firestore Emulator
        run: npx --yes --package firebase-tools@15.34.1 firebase emulators:exec --project demo-swipehome-us4 --only auth,firestore --config tests/firebase.json "python manage.py test accounts properties --verbosity 2"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests del cliente de autenticación
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t swipehome-backend backend

      - name: Arrancar el contenedor
        run: >-
          docker run -d --name swipehome-backend -p 8000:8000
          -e DJANGO_SECRET_KEY=ci-only -e ALLOWED_HOSTS=localhost
          swipehome-backend

      - name: Comprobar /api/health
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:8000/api/health 2>/dev/null || true)
            if [ "$body" = '{"status": "ok"}' ]; then
              echo "OK tras ${i} s: $body"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/api/health no devolvió {\"status\": \"ok\"} en 30 s (última respuesta: ${body:-ninguna})"
          exit 1

      # Se mide el sistema de ficheros descomprimido dentro del contenedor:
      # `docker image inspect` da el tamaño comprimido con el almacén de
      # containerd y el descomprimido con el clásico.
      - name: Comprobar el tamaño de la imagen
        run: |
          docker image ls swipehome-backend
          size_mb=$(docker run --rm --user 0 --entrypoint sh swipehome-backend -c 'du -sxm / | cut -f1')
          echo "Tamaño de la imagen descomprimida: ${size_mb} MB (límite: 600 MB)"
          if [ "$size_mb" -gt 600 ]; then
            echo "::error::La imagen ocupa ${size_mb} MB, más de 600 MB"
            exit 1
          fi

      - name: Logs del contenedor
        if: failure()
        run: docker logs swipehome-backend
