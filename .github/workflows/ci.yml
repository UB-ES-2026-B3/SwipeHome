name: CI

# Se ejecuta en cada PR hacia dev o main, y en cada push a dev.
# El objetivo es que nadie mezcle codigo que rompe los tests.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Si se empuja dos veces seguidas a la misma rama, cancela la ejecucion
# anterior en lugar de gastar minutos en un commit ya superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobaciones de Django
        run: python manage.py check

      - name: Tests
        run: python manage.py test accounts --verbosity 2

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
